services:
  - type: web
    name: jtl-advanced-analyst
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: TRADEMUX_API_KEY
        sync: false
